services:
  postgres:
    image: postgres:16-alpine
    container_name: ceasa-postgres
    environment:
      POSTGRES_DB: ceasa_copacabana
      POSTGRES_USER: ceasa_user
      POSTGRES_PASSWORD: ceasa_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceasa_user -d ceasa_copacabana"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: ceasa-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ceasa.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5051:80"
    depends_on:
      - postgres

volumes:
  postgres_data: